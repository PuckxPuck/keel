apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      # preStop sleep (10s) + APP_HTTP_SHUTDOWN_DRAIN (5s) + APP_HTTP_SHUTDOWN_TIMEOUT (60s), plus margin.
      terminationGracePeriodSeconds: 85
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Deploy by digest, the same one migrate-job.yaml runs, so every node runs the same bytes.
          image: registry.example.com/app@sha256:<digest>
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: APP_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: APP_DATABASE_URL_FILE
              value: /run/secrets/app/database_url
            # part:tenancy
            - name: APP_DATABASE_OPERATOR_URL_FILE
              value: /run/secrets/app/database_operator_url
            # /part:tenancy
            - name: APP_SESSION_KEYS_FILE
              value: /run/secrets/app/session_keys
            # part:mail
            - name: APP_MAIL_SMTP_PASSWORD_FILE
              value: /run/secrets/app/smtp_password
            # /part:mail
            # About 90% of limits.memory; change the two together.
            - name: GOMEMLIMIT
              value: 460MiB
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Longer than the load balancer takes to deregister the pod; the image has no shell for exec sleep.
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: app
            items:
              - key: database_url
                path: database_url
              # part:tenancy
              - key: database_operator_url
                path: database_operator_url
              # /part:tenancy
              - key: session_keys
                path: session_keys
              # part:mail
              - key: smtp_password
                path: smtp_password
              # /part:mail
        - name: tmp
          emptyDir: {}
