# A site file for nginx's http context, for example /etc/nginx/conf.d/app.conf.
# release.sh rewrites the upstream include; install the shipped upstream.conf before enabling this site.
include /etc/nginx/app/upstream.conf;

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    return 308 https://app.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    # Mozilla intermediate.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:app_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # APP_HTTP_MAX_BODY_BYTES; the app enforces each operation's own cap.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The app walks X-Forwarded-For through APP_PROXY_TRUSTED (list nginx there) and keeps
    # X-Request-Id only from a trusted proxy, so nginx always overwrites the client's value.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    # With one server in the upstream the only retry is a request whose cached keepalive connection
    # turned out dead; nginx never retries a POST, LOCK or PATCH once sent (no non_idempotent).
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 5s;
    # Above APP_HTTP_WRITE_TIMEOUT.
    proxy_read_timeout 75s;

    # The app needs no real-IP module: it reads X-Forwarded-For itself. Enable this only so nginx's
    # own logs see the client, when a load balancer or CDN sits in front of nginx.
    # set_real_ip_from 203.0.113.0/24;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location / {
        proxy_pass http://app;
    }

    # A placeholder for the app's upload route, which no module mounts yet; the size is the largest
    # upload policy. nginx buffers the body to disk first, so a slow client never holds the app's
    # APP_HTTP_READ_TIMEOUT; keep the temp path on a filesystem with room for the concurrent uploads.
    location ^~ /api/v1/files/ {
        client_max_body_size 50m;
        client_body_temp_path /var/cache/nginx/app_uploads 1 2;
        proxy_pass http://app;
    }
}

# Loopback only: release.sh asks it which slot nginx routes to before it retires the old slot.
server {
    listen 127.0.0.1:8079;
    access_log off;

    location = /readyz {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_pass http://app;
        add_header X-Upstream $upstream_addr always;
    }

    location / {
        return 404;
    }
}
