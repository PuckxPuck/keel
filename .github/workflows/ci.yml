name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go run ./cmd/keel tidy
      - run: go run ./cmd/keel lint
      # The build without every optional part, so unused code there fails too.
      - run: |
          tags=$(grep -rhoE '^//go:build no[a-z]+$' internal/app | sed 's|//go:build ||' | sort -u | paste -sd, -)
          if [ -n "$tags" ]; then go tool -modfile=tools/go.mod golangci-lint run --build-tags "$tags" ./internal/app/...; fi

  compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go run ./cmd/keel compat

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go run ./cmd/keel vuln

  # part:postgres
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/keel test --engine postgres
        env:
          APP_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      # part:keel
      # keel itself holds both dialects; its gen job checks them together.
      # The off builds' own tests: every part off, then tenancy alone and mail alone.
      - run: |
          tags=$(grep -rhoE '^//go:build no[a-z]+$' internal/app | sed 's|//go:build ||' | sort -u | paste -sd, -)
          for set in "$tags" notenancy nomail,nonotes; do go test -tags "$set" ./internal/app/...; done
        env:
          APP_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      # /part:keel
      - if: hashFiles('db/migrations/mysql/**') == ''
        run: go run ./cmd/keel gen --check
        env:
          APP_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
  # /part:postgres
  # part:mysql
  test-mysql:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/keel test --engine mysql
        env:
          APP_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/mysql
      - if: hashFiles('db/migrations/postgres/**') == ''
        run: go run ./cmd/keel gen --check
        env:
          APP_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/mysql
  # /part:mysql
  # part:keel

  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/keel gen --check
        env:
          APP_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
          APP_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/mysql
  # /part:keel

  databases:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/db-matrix.yml

  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '30s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME"
            done
          done

  # Runs the last good commit and this one back to back on the same runner, so machine variance cancels.
  # A regression fails the run and keeps the old marker; to accept it, delete the marker
  # (gh cache list --key bench-last-good, then gh cache delete) and the next night starts fresh.
  bench:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/bench/last-good
          key: bench-last-good-${{ github.run_id }}
          restore-keys: bench-last-good-
      - run: |
          if [ -s var/bench/last-good ]; then
            go run ./cmd/keel bench --against "$(cat var/bench/last-good)"
          else
            go run ./cmd/keel bench
          fi
      - run: git rev-parse HEAD > var/bench/last-good
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/bench/last-good
          key: bench-last-good-${{ github.run_id }}
