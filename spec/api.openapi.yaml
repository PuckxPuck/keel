            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 1024
            type: string
        - explode: false
          in: query
          name: sort
          schema:
            default: -updatedAt
            enum:
              - title
              - -title
              - createdAt
              - -createdAt
              - updatedAt
              - -updatedAt
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - active
              - archived
            type: string
        - description: Only notes whose title contains this, ignoring case
          explode: false
          in: query
          name: q
          schema:
            description: Only notes whose title contains this, ignoring case
            maxLength: 100
            minLength: 2
            type: string
