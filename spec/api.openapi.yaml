            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyNoteResource"
          description: "Already stored: the resource as it is"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyNoteResource"
          description: Created
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Create a note; a clientId already stored answers 200 with that note
      tags:
        - notes
      x-since: "2026-10-23"
  /v1/notes/{noteId}:
    get:
      operationId: getNote
      parameters:
        - in: path
          name: noteId
          required: true
