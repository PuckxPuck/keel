info:
  title: keel
  version: dev
openapi: 3.1.0
paths:
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyKey"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List API keys, newest first
      tags:
        - api-keys
    post:
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyCreatedKey"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Create an API key; the key is shown once
      tags:
        - api-keys
  /api/v1/api-keys/{keyId}:
    delete:
      operationId: revokeApiKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Stop an API key at once
      tags:
        - api-keys
  /api/v1/auth/dev-login:
    post:
      operationId: devLogin
      requestBody:
        content:
