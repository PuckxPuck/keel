info:
  title: keel
  version: dev
openapi: 3.1.0
paths:
  /api/v1/auth/dev-login:
    post:
      operationId: devLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodySignedIn"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in as any user (local development only)
      tags:
        - auth
  /api/v1/auth/email/verification:
    post:
      operationId: requestEmailVerification
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Send a link that confirms the signed-in user's email address
      tags:
        - auth
  /api/v1/auth/email/verify:
    post:
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Confirm an email address with a verification link
      tags:
        - auth
  /api/v1/auth/invites/accept:
    post:
      operationId: acceptInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Accept an invite and set a password
      tags:
        - auth
  /api/v1/auth/mfa/recovery:
    post:
      operationId: useRecoveryCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyConfirmed"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Pass the second factor with a recovery code
      tags:
        - auth
  /api/v1/auth/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyConfirmed"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Finish setting up an authenticator app
      tags:
        - auth
  /api/v1/auth/mfa/totp/enrol:
    post:
      operationId: enrolTotp
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyEnrolment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Start setting up an authenticator app
      tags:
        - auth
  /api/v1/auth/mfa/totp/verify:
    post:
      operationId: verifyTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyConfirmed"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Pass the second factor with an authenticator code
      tags:
        - auth
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Set a new password with a reset link
      tags:
        - auth
  /api/v1/auth/password/reset-request:
    post:
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Send a password reset link
      tags:
        - auth
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodySignedIn"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in with email and password
      tags:
        - auth
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: End the current session
      tags:
        - auth
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyMe"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: The caller, their roles and permissions
      tags:
        - auth
  /api/v1/ping:
    get:
      operationId: ping
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyPong"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check that the API answers
      tags:
        - system
  /api/v1/tenants:
    get:
      operationId: listTenants
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: The slug the previous page ended on
          explode: false
          in: query
          name: cursor
          schema:
            description: The slug the previous page ended on
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTenant"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List tenants by slug
      tags:
        - tenants
    post:
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyTenant"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Create a tenant with its roles and its owner
      tags:
        - tenants
  /api/v1/tenants/{tenantId}/audit:
    get:
      operationId: listTenantAudit
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Rows older than this seq; 0 starts at the newest
          explode: false
          in: query
          name: before
          schema:
            description: Rows older than this seq; 0 starts at the newest
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyEntry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: A tenant's audit trail, newest first
      tags:
        - tenants
  /api/v1/tenants/{tenantId}/resume:
    post:
      operationId: resumeTenant
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantStateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyTenant"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Make a tenant active again
      tags:
        - tenants
  /api/v1/tenants/{tenantId}/suspend:
    post:
      operationId: suspendTenant
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantStateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneBodyTenant"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Suspend a tenant; its sessions end
      tags:
        - tenants
